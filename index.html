<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Explore Thailand with PMTiles and H3 cells."
    />
    <title>Maps</title>
    <link rel="icon" href="/favicon.ico" />
  </head>
  <body>
    <header class="toolbar">
      <a class="title" href="/">Maps</a>
      <button id="theme-toggle" type="button" aria-label="Switch to dark theme"
        >☾</button
      >
    </header>
    <main>
      <div id="map" aria-label="Interactive map"></div>
      <section class="h3-panel" aria-label="H3 tools">
        <div class="toggle-row">
          <label><input id="h3-enabled" type="checkbox" /> H3 Overlay</label>
          <span id="h3-resolution" hidden></span>
        </div>
        <form id="h3-form" class="lookup-row">
          <label for="h3-cell"
            >H3 cell ID
            <input
              id="h3-cell"
              type="text"
              spellcheck="false"
              autocomplete="off"
            />
          </label>
          <button type="submit">Go</button>
        </form>
        <form id="coordinates-form" class="lookup-row">
          <label for="coordinates"
            >latitude,longitude
            <input
              id="coordinates"
              type="text"
              spellcheck="false"
              autocomplete="off"
            />
          </label>
          <button type="submit">Go</button>
        </form>
      </section>
      <div
        id="notification"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      ></div>
      <noscript
        >JavaScript is required to display the interactive map.</noscript
      >
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
